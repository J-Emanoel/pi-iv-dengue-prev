<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2856e8" />
    <meta name="description" content="DenguePrev: histórico municipal, estimativas e documentos sobre dengue no Espírito Santo." />
    <script>
      // Aplica o tema salvo (ou o do sistema) antes da primeira pintura, evitando piscar.
      try {
        var tema = localStorage.getItem('dengueprev-theme');
        if (tema !== 'light' && tema !== 'dark') {
          tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = tema;
        if (tema === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e1220');
        }
      } catch (e) {}
    </script>
    <title>DenguePrev · Espírito Santo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
