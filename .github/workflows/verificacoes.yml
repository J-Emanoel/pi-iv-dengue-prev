name: Verificações do projeto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacoes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python e contratos da API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: ""
      GROQ_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Conferir dependências
        run: python -m pip check
      - name: Executar testes sem serviços externos
        run: python -B -m pytest -q -p no:cacheprovider

  frontend:
    name: Interface e compilação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências fixadas no lockfile
        run: npm ci
      - name: Executar testes da interface
        run: npm test
      - name: Compilar TypeScript e Vite
        run: npm run build
